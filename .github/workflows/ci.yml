name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test Swift package
        run: swift test
      - name: Package browser extensions
        run: ./script/package_browser_extensions.sh
      - name: Verify extension archives
        run: |
          unzip -t dist/browser-extensions/kite-chromium.zip
          unzip -t dist/browser-extensions/kite-firefox.zip
          unzip -t dist/browser-extensions/kite-safari-project.zip
      - name: Build application bundle
        run: ./script/build_and_run.sh --package
      - name: Verify signing and bundle structure
        run: codesign --verify --deep --strict dist/Kite.app
